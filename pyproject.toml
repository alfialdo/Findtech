[tool.poetry]
name = "findtech"
version = "0.0.0"
description = "ML-based Laptop/Notebook recommender for non technical persons"
authors = ["alfialdo <alfialdo.connect@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.3"
scikit-learn = "^1.8.0"
requests = "^2.32.5"
beautifulsoup4 = "^4.14.3"
playwright = "^1.57.0"
joblib = "^1.5.3"
python-dotenv = "^1.2.1"
streamlit = "^1.53.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "jupyter-client (>=8.8.0,<9.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

